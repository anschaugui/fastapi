[project]
name = "fast-zero"
version = "0.1.0"
description = ""
authors = [
    {name = "guilherme.anschau", email = "anschau.gui@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
    "fastapi[standard] (>=0.142.2,<0.143.0)",
    "sqlalchemy (>=2.1.3,<3.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "alembic (>=1.20.0,<2.0.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.16.10,<0.17.0)",
    "pytest (>=9.1.1,<10.0.0)", 
    "pytest-cov (>=7.1.0,<8.0.0)", 
    "taskipy (>=1.14.1,<2.0.0)"
]

[tool.ruff]
line-length = 79
extend-exclude = ["migrations"]

[tool.ruff.lint]
preview = true
select = ["I", "F", "E", "W", "PL", "PT"]

[tool.ruff.format]
quote-style = 'single'

[tool.pytest.ini_options]
pythonpath = "."
addopts = '-p no:warnings'


[tool.taskipy.tasks]
run = 'fastapi dev fast_zero/app.py --reload'
lint = "ruff check ."
pre_format = "ruff check . --fix"
format = "ruff format ."
pre_test = "task lint"
test = "pytest --cov=fast_zero -vv"
post_test = "coverage html"
html = "start htmlcov\\index.html"